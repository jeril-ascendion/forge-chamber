name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Visual C++ Redistributable
        run: choco install vcredist140 -y
        shell: pwsh

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller==6.9.0
        shell: pwsh

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: backend/build
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Build Python sidecar with PyInstaller
        run: |
          cd backend
          pyinstaller forge_chamber.spec --clean
          echo "Sidecar build contents:"
          Get-ChildItem -Path dist/forge_chamber -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "{0:N0} files, {1:N2} MB total" -f $_.Count, ($_.Sum / 1MB) }
        shell: pwsh

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build
        shell: pwsh

      - name: Install Electron dependencies
        run: cd desktop && npm install
        shell: pwsh

      - name: Build Electron portable exe
        run: cd desktop && npx electron-builder --win --x64 --publish never
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
