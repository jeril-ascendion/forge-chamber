<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge Chamber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0F0F14;
      color: #F9F8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .logo .accent {
      color: #E8533A;
    }

    .tagline {
      font-size: 14px;
      color: #8888AA;
      margin-bottom: 48px;
      letter-spacing: 0.5px;
    }

    .progress-track {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #2B5EA7, #E8533A);
      border-radius: 2px;
      animation: slide 1.8s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(200%); }
      100% { transform: translateX(-100%); }
    }

    .status {
      font-size: 12px;
      color: #555566;
    }
  </style>
</head>
<body>
  <div class="logo">Forge <span class="accent">Chamber</span></div>
  <div class="tagline">Where engineers get tested</div>
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <div class="status">Starting engine...</div>
</body>
</html>
